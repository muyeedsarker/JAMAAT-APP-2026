<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইউনিট কার্যক্রম — SOHOCHOR</title><style>body{font-family:system-ui,sans-serif;background:#f3f7f4;color:#17352a;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.hero,.box{background:#fff;border-radius:20px;padding:20px;margin:14px 0}.hero{background:linear-gradient(135deg,#075a31,#08783f);color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field select,.field input,.field textarea{width:100%;padding:12px;box-sizing:border-box;border:1px solid #dce8e1;border-radius:12px;font:inherit}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{text-align:center;background:#f7fbf8;padding:14px;border-radius:14px}.num{font-size:25px;font-weight:800;color:#075a31}button{background:#08783f;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700}@media(max-width:650px){.grid,.cards{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>📊 ইউনিট কার্যক্রম</h1><p>অনুমোদিত দায়িত্বশীলের নির্ধারিত Scope অনুযায়ী সাংগঠনিক তথ্য।</p></section><section class="box"><h2>সাংগঠনিক এলাকা</h2><div class="grid"><div class="field"><label>বিভাগ</label><select><option>বিভাগ নির্বাচন করুন</option><option>ঢাকা</option><option>চট্টগ্রাম</option><option>রাজশাহী</option><option>খুলনা</option><option>বরিশাল</option><option>সিলেট</option><option>রংপুর</option><option>ময়মনসিংহ</option></select></div><div class="field"><label>জেলা</label><select><option>জেলা নির্বাচন করুন</option></select></div><div class="field"><label>উপজেলা / থানা</label><select><option>উপজেলা / থানা নির্বাচন করুন</option></select></div><div class="field"><label>ওয়ার্ড</label><select id="ward"><option>ওয়ার্ড নির্বাচন করুন</option></select></div><div class="field"><label>শাখা</label><select><option>পুরুষ</option><option>মহিলা</option></select></div><div class="field"><label>ইউনিট</label><select><option>ইউনিট নির্বাচন করুন</option><option>ইউনিট-১</option><option>ইউনিট-২</option><option>ইউনিট-৩</option></select></div></div></section><section class="box"><h2>📈 কার্যক্রমের সারসংক্ষেপ</h2><div class="cards"><div class="card"><div class="num">0</div>সদস্য</div><div class="card"><div class="num">0</div>সক্রিয়</div><div class="card"><div class="num">0</div>কার্যক্রম</div><div class="card"><div class="num">0</div>রিপোর্ট</div></div></section><section class="box"><h2>📝 কার্যক্রম রিপোর্ট</h2><div class="grid"><div class="field"><label>কার্যক্রমের নাম</label><input placeholder="কার্যক্রমের নাম"></div><div class="field"><label>তারিখ</label><input type="date"></div><div class="field"><label>অংশগ্রহণকারী</label><input type="number" min="0"></div><div class="field"><label>রিপোর্ট</label><textarea rows="3"></textarea></div></div><p>বর্তমানে Frontend পর্যায়। Backend সংযোগের পর অনুমোদিত দায়িত্বশীলের Scope অনুযায়ী রিপোর্ট সংরক্ষণ হবে।</p><button type="button">রিপোর্ট প্রস্তুত</button></section></main><script>const w=document.getElementById('ward');for(let i=1;i<=50;i++){const o=document.createElement('option');o.textContent=i+' নং ওয়ার্ড';w.appendChild(o)}</script></body></html>
