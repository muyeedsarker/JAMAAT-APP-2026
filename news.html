<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News & Notice — 28 No Ward</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f4f7f5;margin:0;color:#222}.header{background:linear-gradient(135deg,#075b32,#0b8f50);color:#fff;text-align:center;padding:22px}.container{max-width:700px;margin:auto;padding:16px}.back,.tab{border:0;border-radius:10px;padding:12px;margin-bottom:12px;font-weight:bold}.back{display:block;width:100%;background:#fff;color:#075b32}.tabs{display:flex;gap:8px}.tab{flex:1;background:#dcebe3;color:#075b32}.active{background:#0b6b3a!important;color:#fff!important}.card{background:#fff;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 3px 12px #0001;border-left:4px solid #0b6b3a}.badge{color:#075b32;font-weight:bold}.date{font-size:12px;color:#777}.desc{white-space:pre-wrap;color:#444}.empty{background:#fff;padding:25px;text-align:center;border-radius:14px;color:#777}.hidden{display:none}</style></head><body><header class="header"><h1>📰 News & Notice</h1><p>28 No Ward — ২৮ নং ওয়ার্ড</p></header><main class="container"><button class="back" onclick="location.href='index.html'">🏠 Home Dashboard</button><div class="tabs"><button id="nTab" class="tab active" onclick="show('news')">📰 News</button><button id="oTab" class="tab" onclick="show('notice')">📢 Notice</button></div><section id="news"><h2>সর্বশেষ সংবাদ</h2><div id="newsList">লোড হচ্ছে...</div></section><section id="notice" class="hidden"><h2>সর্বশেষ নোটিশ</h2><div id="noticeList">লোড হচ্ছে...</div></section></main><script>const URL='https://pgwxfccpphjjveoeeqhv.supabase.co',KEY='sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym',db=supabase.createClient(URL,KEY);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const {data,error}=await db.from('ward_items').select('id,type,title,date,description,created_at').eq('status','published').order('date',{ascending:false}).order('created_at',{ascending:false});if(error){newsList.textContent=error.message;return}render('News',newsList,data);render('Notice',noticeList,data)}function render(type,box,data){const a=data.filter(x=>x.type===type);box.innerHTML=a.length?a.map(x=>`<article class="card"><span class="badge">${type==='News'?'📰 News':'📢 Notice'}</span><h3>${esc(x.title)}</h3><div class="date">প্রকাশের তারিখ: ${esc(x.date)}</div><p class="desc">${esc(x.description)}</p></article>`).join(''):'<div class="empty">বর্তমানে কোনো অনুমোদিত তথ্য নেই।</div>'}function show(s){const n=s==='news';news.classList.toggle('hidden',!n);notice.classList.toggle('hidden',n);nTab.classList.toggle('active',n);oTab.classList.toggle('active',!n);location.hash=s}load();if(location.hash==='#notice')show('notice');</script></body></html>
