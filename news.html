<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><link rel="stylesheet" href="theme.css"><title>নিউজ ও নোটিশ — JAMAAT APP</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="page-head"><div class="brand"><img class="brand-logo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Bangladesh_Jamaat-e-_Islami_Logo_%28cropped%29.png" alt="লোগো"><div><div class="brand-title">JAMAAT APP</div><span class="brand-sub">২৮ নং ওয়ার্ড</span></div></div><h1>নিউজ ও নোটিশ</h1><p>সর্বশেষ প্রকাশিত তথ্য এক জায়গায়</p></header><main class="page"><a class="back" href="index.html">← হোমে ফিরে যান</a><div class="tabs"><button id="nTab" class="tab active" onclick="show('news')">📰 নিউজ</button><button id="oTab" class="tab" onclick="show('notice')">📢 নোটিশ</button></div><section id="news"><div class="section-title"><h2>সর্বশেষ সংবাদ</h2></div><div id="newsList">লোড হচ্ছে...</div></section><section id="notice" hidden><div class="section-title"><h2>সর্বশেষ নোটিশ</h2></div><div id="noticeList">লোড হচ্ছে...</div></section></main><nav class="bottom-nav"><a href="index.html"><i>⌂</i>হোম</a><a class="active" href="news.html"><i>📰</i>নিউজ</a><a href="gallery.html"><i>▧</i>গ্যালারি</a><a href="help.html"><i>♡</i>সহায়তা</a><a href="admin.html"><i>☰</i>আরও</a></nav><script>const URL='https://pgwxfccpphjjveoeeqhv.supabase.co',KEY='sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym',db=supabase.createClient(URL,KEY);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const {data,error}=await db.from('ward_items').select('id,type,title,date,description,created_at').eq('status','published').order('date',{ascending:false}).order('created_at',{ascending:false});if(error){newsList.innerHTML='<div class="empty">তথ্য লোড করা যায়নি।</div>';return}render('News',newsList,data);render('Notice',noticeList,data)}function render(type,box,data){const a=data.filter(x=>x.type===type);box.innerHTML=a.length?a.map(x=>`<article class="news-card"><span class="badge">${type==='News'?'📰 NEWS':'📢 NOTICE'}</span><h3>${esc(x.title)}</h3><p class="desc">${esc(x.description)}</p><time>প্রকাশের তারিখ: ${esc(x.date)}</time></article>`).join(''):'<div class="empty">বর্তমানে কোনো অনুমোদিত তথ্য নেই।</div>'}function show(s){const n=s==='news';news.hidden=!n;notice.hidden=n;nTab.classList.toggle('active',n);oTab.classList.toggle('active',!n);if(history.replaceState)history.replaceState(null,'',location.pathname+(n?'':'#notice'))}load();if(location.hash==='#notice')show('notice');</script></body></html>
