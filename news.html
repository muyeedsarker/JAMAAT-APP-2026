<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b6b3a">
<title>News & Notice — 28 No Ward</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,"Noto Sans Bengali",sans-serif}body{background:#f4f7f5;color:#222;line-height:1.6}.header{background:linear-gradient(135deg,#075b32,#0b8f50);color:#fff;padding:22px 16px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.15)}.header h1{font-size:25px;margin-bottom:5px}.header p{font-size:14px;opacity:.95}.container{width:94%;max-width:700px;margin:18px auto 30px}.back-btn{display:block;width:100%;border:0;background:#fff;color:#075b32;padding:13px;border-radius:12px;margin-bottom:15px;font-size:16px;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{flex:1;border:0;padding:12px 8px;border-radius:10px;background:#dcebe3;color:#075b32;font-size:15px;font-weight:bold;cursor:pointer}.tab.active{background:#0b6b3a;color:#fff}.section-title{font-size:20px;color:#075b32;margin-bottom:12px}.card{background:#fff;border-radius:14px;padding:17px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.08);border-left:4px solid #0b6b3a}.badge{display:inline-block;background:#e8f5ed;color:#075b32;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:8px}.card h3{font-size:18px;margin-bottom:7px;color:#222}.date{font-size:13px;color:#777;margin-bottom:8px}.card p{font-size:14px;color:#444;white-space:pre-wrap}.read-btn{margin-top:12px;border:0;background:#0b6b3a;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer}.empty{background:#fff;padding:25px;border-radius:14px;text-align:center;color:#777;box-shadow:0 2px 8px rgba(0,0,0,.06)}.footer{text-align:center;color:#777;font-size:12px;padding:20px 10px}.hidden{display:none}.loading{text-align:center;color:#777;padding:20px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:1000}.modal.show{display:flex}.modal-box{background:#fff;width:100%;max-width:700px;margin:auto;border-radius:20px 20px 0 0;padding:20px;max-height:80vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h2{color:#075b32;font-size:20px}.close{border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}.modal-body{font-size:14px;color:#444;white-space:pre-wrap}.meta{font-size:12px;color:#777;margin-bottom:12px}@media(max-width:400px){.header h1{font-size:22px}.card h3{font-size:17px}.tab{font-size:14px}}
</style>
</head>
<body>
<header class="header"><h1>📰 News & Notice</h1><p>28 No Ward — ২৮ নং ওয়ার্ড</p></header>
<main class="container">
<button class="back-btn" onclick="goHome()">🏠 Home Dashboard</button>
<div class="tabs"><button class="tab active" id="newsTab" onclick="showSection('news')">📰 News</button><button class="tab" id="noticeTab" onclick="showSection('notice')">📢 Notice</button></div>
<section id="newsSection"><h2 class="section-title">সর্বশেষ সংবাদ</h2><div id="newsList" class="loading">লোড হচ্ছে...</div></section>
<section id="noticeSection" class="hidden"><h2 class="section-title">সর্বশেষ নোটিশ</h2><div id="noticeList" class="loading">লোড হচ্ছে...</div></section>
</main>
<footer class="footer">JAMAAT-APP-2026<br>২৮ নং ওয়ার্ড সংস্করণ</footer>
<div class="modal" id="detailModal" onclick="if(event.target===this)closeDetail()"><div class="modal-box"><div class="modal-head"><h2 id="detailTitle"></h2><button class="close" onclick="closeDetail()">×</button></div><div id="detailMeta" class="meta"></div><div id="detailBody" class="modal-body"></div></div></div>
<script>
const DATA_KEY='wardNewsNotice';
function getItems(){try{return JSON.parse(localStorage.getItem(DATA_KEY))||[]}catch(e){return[]}}
function escapeHTML(text){return String(text??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function formatDate(value){if(!value)return '';const d=new Date(value+'T00:00:00');return isNaN(d)?value:d.toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'})}
function render(){const items=getItems().filter(x=>x.status==='published').sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.id||0)-(a.id||0));renderType('News',document.getElementById('newsList'));renderType('Notice',document.getElementById('noticeList'));function renderType(type,box){const data=items.filter(x=>x.type===type);if(!data.length){box.innerHTML=`<div class="empty">বর্তমানে কোনো অনুমোদিত ${type==='News'?'সংবাদ':'নোটিশ'} নেই।</div>`;return}box.innerHTML=data.map(item=>`<article class="card"><span class="badge">${type==='News'?'📰 News':'📢 Notice'}</span><h3>${escapeHTML(item.title)}</h3><div class="date">প্রকাশের তারিখ: ${formatDate(item.date)}</div><p>${escapeHTML(item.description).slice(0,220)}${item.description.length>220?'…':''}</p><button class="read-btn" onclick="readMore(${Number(item.id)})">বিস্তারিত দেখুন</button></article>`).join('')}}
function readMore(id){const item=getItems().find(x=>Number(x.id)===Number(id)&&x.status==='published');if(!item)return;document.getElementById('detailTitle').textContent=item.title;document.getElementById('detailMeta').textContent=`${item.type==='News'?'News':'Notice'} • প্রকাশের তারিখ: ${formatDate(item.date)}`;document.getElementById('detailBody').textContent=item.description;document.getElementById('detailModal').classList.add('show');document.body.style.overflow='hidden'}
function closeDetail(){document.getElementById('detailModal').classList.remove('show');document.body.style.overflow=''}
function showSection(section){const news=section==='news';document.getElementById('newsSection').classList.toggle('hidden',!news);document.getElementById('noticeSection').classList.toggle('hidden',news);document.getElementById('newsTab').classList.toggle('active',news);document.getElementById('noticeTab').classList.toggle('active',!news);history.replaceState(null,'','#'+section)}
function goHome(){location.href='index.html'}
function selectFromHash(){showSection(location.hash.toLowerCase()==='#notice'?'notice':'news')}
window.addEventListener('load',()=>{render();selectFromHash()});window.addEventListener('storage',render);window.addEventListener('hashchange',selectFromHash);
</script>
</body>
</html>
