<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel - 28 No Ward</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f4f7f5;color:#17202a;margin:0}header{background:linear-gradient(135deg,#07552d,#168348);color:#fff;text-align:center;padding:24px}main{max-width:700px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 12px #0001}h2{color:#126b3a}label{display:block;font-weight:bold;margin:10px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}textarea{min-height:110px}button{border:0;border-radius:10px;padding:12px 15px;font-weight:bold;cursor:pointer}.primary{background:#126b3a;color:white;width:100%;margin-top:12px}.approve{background:#15803d;color:#fff}.delete{background:#dc2626;color:#fff}.logout{background:#555;color:#fff;width:100%}.item{background:#f8faf9;border-left:4px solid #168348;padding:13px;border-radius:10px;margin:10px 0}.item p{white-space:pre-wrap;color:#555}.actions{display:flex;gap:8px}.actions button{flex:1}.msg{padding:10px;border-radius:9px;margin-top:10px;display:none}.hidden{display:none!important}.muted{color:#777;font-size:13px}.back{display:block;text-align:center;margin:15px;color:#126b3a}</style></head><body><header><h1>🔐 Admin Panel</h1><p>২৮ নং ওয়ার্ড — Online Management</p></header><main><section class="card" id="authBox"><h2>🔑 Admin Login</h2><p class="muted">প্রথমবার ব্যবহার করলে নিচে Sign up করুন। এই Supabase project-এর প্রথম account স্বয়ংক্রিয়ভাবে Admin হবে।</p><label>Email</label><input id="email" type="email" placeholder="আপনার email"><label>Password</label><input id="password" type="password" placeholder="কমপক্ষে ৬ অক্ষর"><button class="primary" onclick="login()">Login</button><button class="primary" style="background:#2563eb" onclick="signup()">প্রথম Admin Account তৈরি</button><div id="authMsg" class="msg"></div></section><section id="panel" class="hidden"><div class="card"><h2>➕ News / Notice</h2><label>ধরন</label><select id="type"><option>News</option><option>Notice</option></select><label>শিরোনাম</label><input id="title" maxlength="150"><label>তারিখ</label><input id="date" type="date"><label>বিস্তারিত</label><textarea id="description" maxlength="5000"></textarea><button class="primary" onclick="submitItem()">📤 Submit for Approval</button><div id="submitMsg" class="msg"></div></div><div class="card"><h2>⏳ Pending</h2><div id="pending">লোড হচ্ছে...</div></div><div class="card"><h2>✅ Published</h2><div id="published">লোড হচ্ছে...</div></div><button class="logout" onclick="logout()">🚪 Logout</button></section><a class="back" href="index.html">🏠 Home</a></main><script>const URL='https://pgwxfccpphjjveoeeqhv.supabase.co',KEY='sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym';const db=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function msg(el,text,ok=false){el.style.display='block';el.style.background=ok?'#dcfce7':'#fee2e2';el.style.color=ok?'#166534':'#991b1b';el.textContent=text}async function signup(){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return msg($('authMsg'),'Email ও কমপক্ষে ৬ অক্ষরের password দিন।');const {error}=await db.auth.signUp({email,password});if(error)return msg($('authMsg'),error.message);msg($('authMsg'),'Account তৈরি হয়েছে। Email confirmation লাগলে email confirm করে Login করুন।',true)}async function login(){const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg($('authMsg'),error.message);await start(data.user)}async function start(user){const {data:p,error}=await db.from('profiles').select('role').eq('id',user.id).single();if(error||p?.role!=='admin'){await db.auth.signOut();return msg($('authMsg'),'এই account Admin নয়।');}$('authBox').classList.add('hidden');$('panel').classList.remove('hidden');$('date').value=new Date().toISOString().slice(0,10);load()}async function submitItem(){const title=$('title').value.trim(),description=$('description').value.trim();if(!title||!description)return msg($('submitMsg'),'সব তথ্য পূরণ করুন।');const {data:{user}}=await db.auth.getUser();const {error}=await db.from('ward_items').insert({type:$('type').value,title,date:$('date').value,description,status:'pending',created_by:user.id});if(error)return msg($('submitMsg'),error.message);$('title').value='';$('description').value='';msg($('submitMsg'),'সফলভাবে জমা হয়েছে।',true);load()}async function load(){const {data,error}=await db.from('ward_items').select('*').order('created_at',{ascending:false});if(error)return;const pending=data.filter(x=>x.status==='pending'),published=data.filter(x=>x.status==='published');render(pending,$('pending'),true);render(published,$('published'),false)}function render(items,box,p){if(!items.length){box.innerHTML='<p class="muted">কোনো তথ্য নেই।</p>';return}box.innerHTML=items.map(x=>`<div class="item"><b>${x.type==='News'?'📰':'📢'} ${esc(x.title)}</b><small> — ${x.date}</small><p>${esc(x.description)}</p>${p?`<div class="actions"><button class="approve" onclick="approve(${x.id})">✅ Approve</button><button class="delete" onclick="removeItem(${x.id})">🗑️ Delete</button></div>`:`<button class="delete" onclick="removeItem(${x.id})">🗑️ Delete</button>`}</div>`).join('')}async function approve(id){const {error}=await db.from('ward_items').update({status:'published',published_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);load()}async function removeItem(id){if(!confirm('মুছে ফেলবেন?'))return;const {error}=await db.from('ward_items').delete().eq('id',id);if(error)alert(error.message);load()}async function logout(){await db.auth.signOut();location.reload()}db.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)})</script></body></html>
