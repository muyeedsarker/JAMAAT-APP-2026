<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#064b2c"><link rel="stylesheet" href="theme.css"><title>Admin Panel — JAMAAT APP</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>input,textarea,select{width:100%;padding:12px 13px;border:1px solid #dce6df;border-radius:12px;box-sizing:border-box;background:#fbfdfb;font:inherit;color:#17231d}textarea{min-height:100px;resize:vertical}label{display:block;font-weight:800;font-size:13px;margin:10px 0 5px}.primary,.approve,.delete,.logout{border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#08783f,#0da15a);color:#fff;width:100%;margin-top:10px}.approve{background:#08783f;color:#fff}.delete{background:#c92f2f;color:#fff}.logout{background:#26332c;color:#fff;width:100%;margin-top:8px}.item{background:#f8fbf9;border:1px solid #e0ebe4;border-left:4px solid #08783f;padding:14px;border-radius:14px;margin:10px 0}.item p{white-space:pre-wrap;color:#59645e;line-height:1.6;font-size:13px}.actions{display:flex;gap:8px}.actions button{flex:1}.msg{padding:10px;border-radius:10px;margin-top:10px;display:none;font-size:12px}.hidden{display:none!important}.muted{color:#6d7771;font-size:12px;line-height:1.7}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{border:1px solid #dce6df;background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;white-space:nowrap}.tab.active{background:#08783f;color:#fff}.section{display:none}.section.active{display:block}.upload{border:1px dashed #b7cdbd;padding:12px;border-radius:12px;background:#f7fbf8;margin-top:8px}</style></head><body><header class="page-head"><div class="brand"><img class="brand-logo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Bangladesh_Jamaat-e-_Islami_Logo_%28cropped%29.png" alt="লোগো"><div><div class="brand-title">JAMAAT APP</div><span class="brand-sub">২৮ নং ওয়ার্ড • Admin Management</span></div></div><h1>অ্যাডমিন প্যানেল</h1><p>কনটেন্ট তৈরি, অনুমোদন ও প্রকাশ</p></header><main class="page"><section class="panel" id="authBox"><div class="gold-line"></div><h2>🔐 অ্যাডমিন লগইন</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="primary" onclick="login()">Login</button><button class="primary" style="background:#245f9e" onclick="signup()">প্রথম Admin Account তৈরি</button></section><section id="panel" class="hidden"><div class="panel"><div class="gold-line"></div><h2>➕ কনটেন্ট যোগ করুন</h2><div class="tabs"><button class="tab active" onclick="switchType('ward')">📰 News/Notice</button><button class="tab" onclick="switchType('service')">🤝 সেবা</button><button class="tab" onclick="switchType('committee')">👥 কমিটি</button><button class="tab" onclick="switchType('gallery')">🖼️ গ্যালারি</button><button class="tab" onclick="switchType('document')">📄 ডকুমেন্ট</button><button class="tab" onclick="switchType('help')">🆘 হেল্প</button></div><div id="ward" class="section active"><label>ধরন</label><select id="wtype"><option>News</option><option>Notice</option></select><label>শিরোনাম</label><input id="wtitle"><label>তারিখ</label><input id="wdate" type="date"><label>বিস্তারিত</label><textarea id="wdesc"></textarea><button class="primary" onclick="addWard()">📤 Pending-এ জমা দিন</button></div><div id="service" class="section"><label>শিরোনাম</label><input id="stitle"><label>বিবরণ</label><textarea id="sdesc"></textarea><label>আইকন</label><input id="sicon" value="🤝"><label>যোগাযোগ তথ্য</label><input id="scontact"><button class="primary" onclick="addRow('services',{title:V('stitle'),description:V('sdesc'),icon:V('sicon'),contact_text:V('scontact'),status:'pending'})">সেবা Pending-এ যোগ করুন</button></div><div id="committee" class="section"><label>নাম</label><input id="cname"><label>দায়িত্ব</label><input id="crole"><label>ফোন</label><input id="cphone"><label>ছবি</label><div class="upload"><input id="cfile" type="file" accept="image/*"><small id="cstatus" class="muted"></small></div><button class="primary" onclick="addCommittee()">কমিটি Pending-এ যোগ করুন</button></div><div id="gallery" class="section"><label>শিরোনাম</label><input id="gtitle"><label>বিবরণ</label><textarea id="gdesc"></textarea><label>ধরন</label><select id="gtype"><option value="image">ছবি</option><option value="video">ভিডিও</option></select><div class="upload"><input id="gfile" type="file" accept="image/*,video/*"><small class="muted">ছবি/ভিডিও নির্বাচন করুন</small></div><button class="primary" onclick="addGallery()">গ্যালারি Pending-এ যোগ করুন</button></div><div id="document" class="section"><label>শিরোনাম</label><input id="dtitle"><label>বিবরণ</label><textarea id="ddesc"></textarea><label>ক্যাটাগরি</label><input id="dcat" value="সাধারণ"><div class="upload"><input id="dfile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx"><small class="muted">ডকুমেন্ট নির্বাচন করুন</small></div><button class="primary" onclick="addDocument()">ডকুমেন্ট Pending-এ যোগ করুন</button></div><div id="help" class="section"><label>ধরন</label><select id="htype"><option value="faq">সাধারণ প্রশ্ন</option><option value="contact">যোগাযোগ</option><option value="emergency">জরুরি সহায়তা</option><option value="message">বার্তা</option></select><label>শিরোনাম</label><input id="htitle"><label>বিবরণ</label><textarea id="hdesc"></textarea><label>যোগাযোগ/লিংক</label><input id="hvalue"><button class="primary" onclick="addRow('help_items',{item_type:V('htype'),title:V('htitle'),description:V('hdesc'),contact_value:V('hvalue'),status:'pending'})">হেল্প Pending-এ যোগ করুন</button></div><div id="submitMsg" class="msg"></div></div><div class="panel"><h2>⏳ Pending Approval</h2><div id="pending">লোড হচ্ছে...</div></div><div class="panel"><h2>✅ Published</h2><div id="published">লোড হচ্ছে...</div></div><button class="logout" onclick="logout()">🚪 Logout</button></section><a class="back" href="index.html">← Home Dashboard</a></main><script>const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');const $=id=>document.getElementById(id),V=id=>$(id).value.trim(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function msg(t,ok=false){const e=$('submitMsg');e.style.display='block';e.style.background=ok?'#dcf7e5':'#fde7e7';e.style.color=ok?'#176b3b':'#9d2929';e.textContent=t}function switchType(t){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(t).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));[...document.querySelectorAll('.tab')].find(x=>x.textContent.toLowerCase().includes(t==='ward'?'news':t==='service'?'সেবা':t==='committee'?'কমিটি':t==='gallery'?'গ্যালারি':t==='document'?'ডকুমেন্ট':'হেল্প'))?.classList.add('active')}async function signup(){const {error}=await db.auth.signUp({email:V('email'),password:V('password')});if(error)alert(error.message);else alert('Account তৈরি হয়েছে। Email confirmation থাকলে confirm করুন।')}async function login(){const {data,error}=await db.auth.signInWithPassword({email:V('email'),password:V('password')});if(error)alert(error.message);else start(data.user)}async function start(user){const {data:p}=await db.from('profiles').select('role').eq('id',user.id).single();if(p?.role!=='admin'){await db.auth.signOut();return alert('এই account Admin নয়।')}$('authBox').classList.add('hidden');$('panel').classList.remove('hidden');$('wdate').value=new Date().toISOString().slice(0,10);load()}async function upload(file,bucket,folder){if(!file)throw new Error('ফাইল নির্বাচন করুন');const ext=file.name.split('.').pop().toLowerCase();const path=folder+'/'+crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from(bucket).upload(path,file,{upsert:false});if(error)throw error;return db.storage.from(bucket).getPublicUrl(path).data.publicUrl}async function addWard(){const {data:{user}}=await db.auth.getUser();const {error}=await db.from('ward_items').insert({type:V('wtype'),title:V('wtitle'),date:V('wdate'),description:V('wdesc'),status:'pending',created_by:user.id});if(error)msg(error.message);else{msg('সফলভাবে Pending-এ জমা হয়েছে।',true);load()}}async function addRow(table,row){const {data:{user}}=await db.auth.getUser();row.created_by=user.id;const {error}=await db.from(table).insert(row);if(error)msg(error.message);else{msg('সফলভাবে Pending-এ জমা হয়েছে।',true);load()}}async function addGallery(){try{const f=$('gfile').files[0];const url=await upload(f,'jamaat-media','gallery');await addRow('gallery_items',{title:V('gtitle'),description:V('gdesc'),media_type:V('gtype'),media_url:url,status:'pending'});msg('গ্যালারি Pending-এ জমা হয়েছে।',true)}catch(e){msg(e.message)}}async function addDocument(){try{const f=$('dfile').files[0];const url=await upload(f,'jamaat-documents','documents');await addRow('documents',{title:V('dtitle'),description:V('ddesc'),category:V('dcat'),file_url:url,file_name:f.name,status:'pending'});msg('ডকুমেন্ট Pending-এ জমা হয়েছে।',true)}catch(e){msg(e.message)}}async function addCommittee(){try{let url=null;const f=$('cfile').files[0];if(f)url=await upload(f,'jamaat-media','committee');await addRow('committee_members',{name:V('cname'),role_title:V('crole'),phone:V('cphone'),photo_url:url,status:'pending'})}catch(e){msg(e.message)}}async function load(){const tables=['ward_items','services','committee_members','gallery_items','documents','help_items'];let p='',pub='';for(const t of tables){const {data}=await db.from(t).select('*').order('created_at',{ascending:false});(data||[]).forEach(x=>{const label=x.title||x.name||'কনটেন্ট',row=`<div class="item"><b>${x.status==='pending'?'⏳':'✅'} ${esc(label)}</b><small> — ${esc(t)}</small><p>${esc(x.description||x.role_title||'')}</p>${x.status==='pending'?`<div class="actions"><button class="approve" onclick="approve('${t}',${x.id})">✅ Approve</button><button class="delete" onclick="removeItem('${t}',${x.id})">🗑️ Delete</button></div>`:`<button class="delete" onclick="removeItem('${t}',${x.id})">🗑️ Delete</button>`}</div>`;if(x.status==='pending')p+=row;else pub+=row})}$('pending').innerHTML=p||'<p class="muted">কোনো Pending নেই।</p>';$('published').innerHTML=pub||'<p class="muted">কোনো Published নেই।</p>'}async function approve(t,id){const {error}=await db.from(t).update({status:'published',published_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);load()}async function removeItem(t,id){if(confirm('মুছে ফেলবেন?')){const {error}=await db.from(t).delete().eq('id',id);if(error)alert(error.message);load()}}async function logout(){await db.auth.signOut();location.reload()}db.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)})</script></body></html>
