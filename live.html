<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><link rel="stylesheet" href="theme.css?v=6"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>লাইভ — SOHOCHOR</title><style>.livebox{background:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}.live-dot{display:inline-flex;align-items:center;gap:7px;background:#ffe7e7;color:#b21e1e;padding:7px 11px;border-radius:999px;font-weight:900;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:#e51d2a;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.25}}.platforms{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.platform{display:block;text-align:center;text-decoration:none;color:#fff;border-radius:16px;padding:16px;font-weight:900}.yt{background:#e21b23}.fb{background:#1877f2}.off{background:#f1f5f2;color:#68736c;border:1px solid var(--line);padding:22px;border-radius:18px;text-align:center}@media(max-width:480px){.platforms{grid-template-columns:1fr}}</style></head><body><header class="page-head"><div class="brand"><img class="brand-logo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Bangladesh_Jamaat-e-_Islami_Logo_%28cropped%29.png" alt="লোগো"><div><div class="brand-title">SOHOCHOR</div><span class="brand-sub">সহচর • দ্বীন • জ্ঞান • সেবা • সমাজ</span></div></div><h1>🔴 লাইভ সম্প্রচার</h1><p>YouTube ও Facebook Live</p></header><main class="page"><a class="back" href="index.html">← হোমে ফিরে যান</a><div id="live" class="livebox">লোড হচ্ছে...</div></main><nav class="bottom-nav"><a href="index.html"><i>⌂</i>হোম</a><a href="news.html"><i>📰</i>নিউজ</a><a class="active" href="live.html"><i>🔴</i>লাইভ</a><a href="gallery.html"><i>▧</i>গ্যালারি</a><a href="help.html"><i>♡</i>সহায়তা</a></nav><script>const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');const box=document.getElementById('live');let was=false;function sound(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();o.stop(a.currentTime+.35)}catch(e){}}async function load(){const {data}=await db.from('live_settings').select('*').limit(1).single();if(!data){box.innerHTML='<div class="off">লাইভ তথ্য পাওয়া যায়নি।</div>';return}if(data.is_live){box.innerHTML=`<span class="live-dot"><span class="dot"></span> LIVE NOW</span><h2>${data.title||'২৮ নং ওয়ার্ড লাইভ'}</h2><p>বর্তমানে লাইভ সম্প্রচার চলছে। আপনার পছন্দের প্ল্যাটফর্ম নির্বাচন করুন।</p><div class="platforms">${data.youtube_url?`<a class="platform yt" target="_blank" rel="noopener" href="${data.youtube_url}">▶ YouTube Live</a>`:''}${data.facebook_url?`<a class="platform fb" target="_blank" rel="noopener" href="${data.facebook_url}">f Facebook Live</a>`:''}</div>`;if(!was){sound();was=true}}else{was=false;box.innerHTML='<div class="off">🔴 এই মুহূর্তে কোনো লাইভ সম্প্রচার চলছে না।<br><small>লাইভ শুরু হলে এখানে দেখা যাবে।</small></div>'}}load();setInterval(load,10000);</script></body></html>
