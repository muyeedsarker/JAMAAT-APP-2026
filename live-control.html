<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="theme.css?v=6"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Live Control — SOHOCHOR</title><style>input{width:100%;padding:13px;border:1px solid #dce6df;border-radius:12px;box-sizing:border-box;font:inherit}label{display:block;font-weight:800;font-size:13px;margin:12px 0 6px}.switch{display:flex;align-items:center;gap:10px;margin:14px 0;font-weight:900}.switch input{width:22px;height:22px}.save{width:100%;border:0;border-radius:12px;padding:13px;background:#08783f;color:#fff;font-weight:900;font-size:15px}.msg{margin-top:10px;padding:10px;border-radius:10px;background:#e8f6ed;color:#176b3b}</style></head><body><header class="page-head"><div class="brand"><img class="brand-logo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Bangladesh_Jamaat-e-_Islami_Logo_%28cropped%29.png"><div><div class="brand-title">SOHOCHOR</div><span class="brand-sub">সহচর • লাইভ কন্ট্রোল</span></div></div><h1>🔴 Live Control</h1><p>YouTube + Facebook</p></header><main class="page"><a class="back" href="admin.html">← অ্যাডমিন প্যানেলে ফিরে যান</a><section class="panel"><h2>লাইভ সেটিংস</h2><label class="switch"><input id="live" type="checkbox"> 🔴 এখন লাইভ চালু</label><label>লাইভের শিরোনাম</label><input id="title" value="২৮ নং ওয়ার্ড লাইভ"><label>YouTube Live URL</label><input id="youtube" placeholder="https://youtube.com/live/..."><label>Facebook Live URL</label><input id="facebook" placeholder="https://facebook.com/.../live"><button class="save" onclick="save()">💾 Live Settings Save</button><div id="msg" class="msg" hidden>সফলভাবে সংরক্ষণ হয়েছে।</div></section></main><script>const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');async function auth(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin.html';return}const {data:p}=await db.from('profiles').select('role').eq('id',session.user.id).single();if(p?.role!=='admin'){alert('Admin access required');location.href='index.html';return}load()}async function load(){const {data}=await db.from('live_settings').select('*').limit(1).single();if(data){live.checked=data.is_live;title.value=data.title||'';youtube.value=data.youtube_url||'';facebook.value=data.facebook_url||''}}async function save(){const {data:{session}}=await db.auth.getSession();if(!session)return;const {data:row}=await db.from('live_settings').select('id').limit(1).single();const {error}=await db.from('live_settings').update({is_live:live.checked,title:title.value.trim()||'২৮ নং ওয়ার্ড লাইভ',youtube_url:youtube.value.trim()||null,facebook_url:facebook.value.trim()||null,updated_at:new Date().toISOString()}).eq('id',row.id);if(error)alert(error.message);else{msg.hidden=false;setTimeout(()=>msg.hidden=true,2500)}}auth()</script></body></html>
