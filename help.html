e)}</h3><p>${esc(x.description)}</p>${x.contact_value?`<a href="${x.item_type==='contact'||x.item_type==='emergency'?'tel:':''}${esc(x.contact_value)}" style="display:inline-block;margin-top:10px;color:#08783f;font-weight:900">${x.item_type==='contact'||x.item_type==='emergency'?'📞 যোগাযোগ করুন': '✉️ বার্তা/তথ্য'}</a>`:''}</article>`).join('')}load();</script></body></html>
