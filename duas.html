<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08783f"><meta name="description" content="SOHOCHOR-এর প্রয়োজনীয় দোয়া — আরবি, বাংলা উচ্চারণ, অর্থ ও উৎস"><title>প্রয়োজনীয় দোয়া — SOHOCHOR</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="theme.css?v=6"><style>body{background:#f3f4f6}.wrap{max-width:850px;margin:auto;padding:16px}.head{background:#08783f;color:#fff;border-radius:18px;padding:20px;text-align:center;margin-bottom:14px}.head h1{margin:0 0 6px}.head p{margin:0;opacity:.92}.back{display:inline-block;margin-bottom:10px;color:#08783f;text-decoration:none;font-weight:700}.toc,.search{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px}.toc h2{margin:0 0 10px}.toc a{display:block;text-decoration:none;color:#183b2b;background:#f5f8f6;border:1px solid #e1ebe5;border-radius:12px;padding:11px;margin:7px 0;font-weight:700}.search input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9e2dc;border-radius:11px;font-size:16px}.dua{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.05);scroll-margin-top:12px}.dua h2{font-size:19px;margin:0 0 10px}.arabic{font-size:25px;line-height:2;text-align:right;color:#174d35;direction:rtl}.pron{font-size:17px;line-height:1.9;margin-top:12px}.meaning{font-size:15px;line-height:1.8;margin-top:8px}.source{font-size:12px;color:#68736d;margin-top:10px;border-top:1px solid #edf0ee;padding-top:8px}.copy{margin-top:10px;border:0;border-radius:10px;padding:9px 14px;background:#eef3ef;font-weight:700}.top{display:inline-block;margin-top:4px;color:#08783f;text-decoration:none;font-weight:700}.count{font-size:13px;color:#68736d;margin:8px 0}.empty{text-align:center;background:#fff;padding:24px;border-radius:16px;color:#666}</style></head><body><main class="wrap"><a class="back" href="index.html">← হোমে ফিরে যান</a><section class="head"><h1>🤲 প্রয়োজনীয় দোয়া</h1><p>SOHOCHOR — সহচর • দ্বীন • জ্ঞান • সেবা • সমাজ</p></section><section class="toc" id="toc"><h2>📖 সূচিপত্র</h2><div id="tocList"></div></section><section class="search"><input id="search" type="search" placeholder="দোয়া খুঁজুন…"></section><div class="count" id="count"></div><section id="list"></section></main><script>
const duas=[
{cat:'সকাল-সন্ধ্যা',title:'সকাল-সন্ধ্যার সুরক্ষা',arabic:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',pron:'বিসমিল্লাহিল্লাজি লা ইয়াদুররু মা‘আসমিহি শাইউন ফিল আরদি ওয়া লা ফিস সামাই, ওয়া হুওয়াস সামীউল আলীম।',meaning:'আল্লাহর নামে, যাঁর নামের সঙ্গে আকাশ ও পৃথিবীর কোনো কিছুই ক্ষতি করতে পারে না; তিনি সর্বশ্রোতা, সর্বজ্ঞ।',source:'আবু দাউদ ৫০৮৮; তিরমিযি ৩৩৮৮'},
{cat:'ঘুম',title:'ঘুমানোর দোয়া',arabic:'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا',pron:'বিসমিকা আল্লাহুম্মা আমুতু ওয়া আহইয়া।',meaning:'হে আল্লাহ! আপনার নামেই আমি মৃত্যুবরণ করি এবং জীবিত হই।',source:'সহিহ বুখারি ৬৩২৪'},
{cat:'ঘুম',title:'ঘুম থেকে ওঠার দোয়া',arabic:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',pron:'আলহামদু লিল্লাহিল্লাজি আহইয়ানা বা‘দা মা আমাতানা ওয়া ইলাইহিন নুশূর।',meaning:'সমস্ত প্রশংসা আল্লাহর, যিনি আমাদের মৃত্যুর পর জীবিত করেছেন এবং তাঁর কাছেই পুনরুত্থান।',source:'সহিহ বুখারি ৬৩১২'},
{cat:'খাবার',title:'খাবার শুরু করার দোয়া',arabic:'بِسْمِ اللَّهِ',pron:'বিসমিল্লাহ।',meaning:'আল্লাহর নামে।',source:'সহিহ বুখারি ৫৩৭৬'},
{cat:'খাবার',title:'খাবার শেষে দোয়া',arabic:'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ',pron:'আলহামদু লিল্লাহিল্লাজি আত‘আমানি হাজা ওয়া রাযাকানিহি মিন গাইরি হাওলিন মিন্নি ওয়া লা কুওয়াহ।',meaning:'সমস্ত প্রশংসা আল্লাহর, যিনি আমাকে এটি খাওয়ালেন এবং আমার কোনো শক্তি বা সামর্থ্য ছাড়াই আমাকে তা রিজিক হিসেবে দিলেন।',source:'সুনান আবু দাউদ ৪০২৩'},
{cat:'ঘর',title:'ঘরে প্রবেশের দোয়া',arabic:'بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا',pron:'বিসমিল্লাহি ওয়ালাজনা, ওয়া বিসমিল্লাহি খারাজনা, ওয়া আলা রাব্বিনা তাওয়াক্কালনা।',meaning:'আল্লাহর নামে আমরা প্রবেশ করলাম, আল্লাহর নামেই বের হলাম এবং আমাদের রবের ওপরই আমরা ভরসা করলাম।',source:'সুনান আবু দাউদ ৫০৯৬'},
{cat:'ঘর',title:'ঘর থেকে বের হওয়ার দোয়া',arabic:'بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',pron:'বিসমিল্লাহি, তাওয়াক্কালতু আলাল্লাহি, ওয়া লা হাওলা ওয়া লা কুওয়াতা ইল্লা বিল্লাহ।',meaning:'আল্লাহর নামে বের হচ্ছি; আমি আল্লাহর ওপর ভরসা করলাম। আল্লাহ ছাড়া কোনো শক্তি ও সামর্থ্য নেই।',source:'সুনান আবু দাউদ ৫০৯৫'},
{cat:'মসজিদ',title:'মসজিদে প্রবেশের দোয়া',arabic:'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ',pron:'আল্লাহুম্মাফতাহ লি আবওয়াবা রাহমাতিক।',meaning:'হে আল্লাহ! আমার জন্য আপনার রহমতের দরজাগুলো খুলে দিন।',source:'সহিহ মুসলিম ৭১৩'},
{cat:'মসজিদ',title:'মসজিদ থেকে বের হওয়ার দোয়া',arabic:'اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ',pron:'আল্লাহুম্মা ইন্নি আসআলুকা মিন ফাদলিক।',meaning:'হে আল্লাহ! আমি আপনার অনুগ্রহ প্রার্থনা করছি।',source:'সহিহ মুসলিম ৭১৩'},
{cat:'সফর',title:'সফরের দোয়া',arabic:'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ',pron:'সুবহানাল্লাজি সাখখারা লানা হাজা ওয়া মা কুন্না লাহু মুকরিনীন, ওয়া ইন্না ইলা রাব্বিনা লামুনকালিবূন।',meaning:'পবিত্র তিনি, যিনি এটিকে আমাদের অনুগত করে দিয়েছেন; আমরা নিজেরা তা করতে সক্ষম ছিলাম না। আর নিশ্চয়ই আমরা আমাদের রবের কাছেই ফিরে যাব।',source:'কুরআন ৪৩:১৩-১৪'},
{cat:'অসুস্থতা',title:'অসুস্থ ব্যক্তির জন্য দোয়া',arabic:'أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ',pron:'আসআলুল্লাহাল আজীম, রাব্বাল আরশিল আজীম, আন ইয়াশফিয়াক।',meaning:'আমি মহান আল্লাহর কাছে, মহান আরশের রবের কাছে প্রার্থনা করছি, তিনি যেন আপনাকে সুস্থ করেন।',source:'সুনান আবু দাউদ ৩১০৬; তিরমিযি ২০৮৩'},
{cat:'দুশ্চিন্তা',title:'দুশ্চিন্তা ও কষ্টের সময়ের দোয়া',arabic:'لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ',pron:'লা ইলাহা ইল্লা আনতা সুবহানাকা ইন্নি কুনতু মিনাজ জালিমীন।',meaning:'আপনি ছাড়া কোনো উপাস্য নেই; আপনি পবিত্র। নিশ্চয়ই আমি জালিমদের অন্তর্ভুক্ত ছিলাম।',source:'কুরআন ২১:৮৭'},
{cat:'ক্ষমা',title:'ইস্তিগফার',arabic:'أَسْتَغْفِرُ اللَّهَ',pron:'আস্তাগফিরুল্লাহ।',meaning:'আমি আল্লাহর কাছে ক্ষমা প্রার্থনা করছি।',source:'সহিহ মুসলিম'},
{cat:'বাবা-মা',title:'বাবা-মায়ের জন্য দোয়া',arabic:'رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا',pron:'রাব্বির হামহুমা কামা রাব্বাইয়ানি সাগীরা।',meaning:'হে আমার রব! তাঁদের প্রতি দয়া করুন, যেমন তাঁরা শৈশবে আমাকে লালন-পালন করেছেন।',source:'কুরআন ১৭:২৪'},
{cat:'দুনিয়া ও আখিরাত',title:'দুনিয়া ও আখিরাতের কল্যাণের দোয়া',arabic:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',pron:'রাব্বানা আতিনা ফিদ্দুনইয়া হাসানাতাও ওয়া ফিল আখিরাতি হাসানাতাও ওয়া কিনা আজাবান নার।',meaning:'হে আমাদের রব! আমাদের দুনিয়ায় কল্যাণ দিন, আখিরাতেও কল্যাণ দিন এবং আগুনের শাস্তি থেকে আমাদের রক্ষা করুন।',source:'কুরআন ২:২০১'}
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const cats=[...new Set(duas.map(d=>d.cat))];
document.getElementById('tocList').innerHTML=cats.map((c,i)=>`<a href="#cat-${i}">📖 ${esc(c)}</a>`).join('');
function render(){const q=document.getElementById('search').value.trim().toLowerCase();let items=duas.filter(d=>!q||[d.title,d.cat,d.pron,d.meaning].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=`${items.length}টি দোয়া দেখানো হচ্ছে`;document.getElementById('list').innerHTML=items.length?cats.map((cat,ci)=>{const a=items.filter(d=>d.cat===cat);if(!a.length)return '';return `<section id="cat-${ci}"><h2>📖 ${esc(cat)}</h2>${a.map(d=>`<article class="dua"><h2>${esc(d.title)}</h2><div class="arabic">${esc(d.arabic)}</div><div class="pron"><b>বাংলা উচ্চারণ:</b> ${esc(d.pron)}</div><div class="meaning"><b>অর্থ:</b> ${esc(d.meaning)}</div><div class="source"><b>উৎস:</b> ${esc(d.source)}</div><button class="copy" type="button" data-copy="${esc(d.arabic+'\n\nবাংলা উচ্চারণ: '+d.pron+'\n\nঅর্থ: '+d.meaning)}">📋 কপি</button><br><a class="top" href="#toc">↑ সূচিপত্রে ফিরে যান</a></article>`).join('')}</section>`}).join(''):'<div class="empty">কোনো দোয়া পাওয়া যায়নি।</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(b.dataset.copy).then(()=>{b.textContent='✅ কপি হয়েছে';setTimeout(()=>b.textContent='📋 কপি',1200)}));}
document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
