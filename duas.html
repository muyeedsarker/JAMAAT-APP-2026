<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08783f"><meta name="description" content="SOHOCHOR-এর প্রয়োজনীয় দোয়া — আরবি, বাংলা উচ্চারণ, অর্থ ও উৎস"><title>প্রয়োজনীয় দোয়া — SOHOCHOR</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="theme.css?v=6"><style>body{background:#f3f4f6}.wrap{max-width:850px;margin:auto;padding:16px}.head{background:#08783f;color:#fff;border-radius:18px;padding:20px;text-align:center;margin-bottom:14px}.head h1{margin:0 0 6px}.head p{margin:0;opacity:.92}.back{display:inline-block;margin-bottom:10px;color:#08783f;text-decoration:none;font-weight:700}.search{background:#fff;padding:12px;border-radius:16px;margin-bottom:14px}.search input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9e2dc;border-radius:11px;font-size:16px}.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}.cat{white-space:nowrap;border:1px solid #d9e2dc;background:#fff;border-radius:20px;padding:8px 12px;font-weight:700}.cat.active{background:#08783f;color:#fff;border-color:#08783f}.dua{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}.dua h2{font-size:19px;margin:0 0 10px}.arabic{font-size:25px;line-height:2;text-align:right;color:#174d35;direction:rtl}.trans{font-size:16px;line-height:1.8;margin-top:10px}.meaning{font-size:15px;line-height:1.7;margin-top:8px}.source{font-size:12px;color:#68736d;margin-top:10px;border-top:1px solid #edf0ee;padding-top:8px}.copy{margin-top:10px;border:0;border-radius:10px;padding:9px 14px;background:#eef3ef;font-weight:700}.empty{text-align:center;background:#fff;padding:24px;border-radius:16px;color:#666}.count{font-size:13px;color:#68736d;margin:8px 0}</style></head>
<body><main class="wrap"><a class="back" href="index.html">← হোমে ফিরে যান</a><section class="head"><h1>🤲 প্রয়োজনীয় দোয়া</h1><p>SOHOCHOR — সহচর • দ্বীন • জ্ঞান • সেবা • সমাজ</p></section><section class="search"><input id="search" type="search" placeholder="দোয়া খুঁজুন… (যেমন: ঘুম, খাবার, সফর)"></section><div class="cats" id="cats"></div><div class="count" id="count"></div><section id="list"></section></main>
<script>
const duas=[
{cat:'সকাল-সন্ধ্যা',title:'সকাল-সন্ধ্যার সুরক্ষা',arabic:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',trans:'Bismillahil-ladhi la yadurru ma‘asmihi shay’un fil-ardi wa la fis-sama’i wa huwas-Sami‘ul-‘Alim.',meaning:'আল্লাহর নামে, যাঁর নামের সঙ্গে আকাশ ও পৃথিবীর কোনো কিছুই ক্ষতি করতে পারে না; তিনি সর্বশ্রোতা, সর্বজ্ঞ।',source:'আবু দাউদ ৫০৮৮; তিরমিযি ৩৩৮৮'},
{cat:'ঘুম',title:'ঘুমানোর দোয়া',arabic:'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا',trans:'Bismika Allahumma amutu wa ahya.',meaning:'হে আল্লাহ! আপনার নামেই আমি মৃত্যুবরণ করি এবং জীবিত হই।',source:'সহিহ বুখারি ৬৩২৪'},
{cat:'ঘুম',title:'ঘুম থেকে ওঠার দোয়া',arabic:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',trans:'Alhamdu lillahil-ladhi ahyana ba‘da ma amatana wa ilayhin-nushur.',meaning:'সমস্ত প্রশংসা আল্লাহর, যিনি আমাদের মৃত্যুর পর জীবিত করেছেন এবং তাঁর কাছেই পুনরুত্থান।',source:'সহিহ বুখারি ৬৩১২'},
{cat:'খাবার',title:'খাবার শুরু করার দোয়া',arabic:'بِسْمِ اللَّهِ',trans:'Bismillah.',meaning:'আল্লাহর নামে।',source:'খাবার শুরুতে বিসমিল্লাহ বলা সুন্নাহ'},
{cat:'খাবার',title:'খাবার শেষে দোয়া',arabic:'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ',trans:'Alhamdu lillahil-ladhi at‘amani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah.',meaning:'সমস্ত প্রশংসা আল্লাহর, যিনি আমাকে এটি খাওয়ালেন এবং আমার কোনো শক্তি বা সামর্থ্য ছাড়াই আমাকে তা রিজিক হিসেবে দিলেন।',source:'সুনান আবু দাউদ ৪০২৩'},
{cat:'ঘর',title:'ঘরে প্রবেশের দোয়া',arabic:'بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا',trans:'Bismillahi walajna, wa bismillahi kharajna, wa ‘ala rabbina tawakkalna.',meaning:'আল্লাহর নামে আমরা প্রবেশ করলাম, আল্লাহর নামেই বের হলাম এবং আমাদের রবের ওপরই আমরা ভরসা করলাম।',source:'সুনান আবু দাউদ ৫০৯৬'},
{cat:'ঘর',title:'ঘর থেকে বের হওয়ার দোয়া',arabic:'بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',trans:'Bismillahi, tawakkaltu ‘alallah, wa la hawla wa la quwwata illa billah.',meaning:'আল্লাহর নামে বের হচ্ছি; আমি আল্লাহর ওপর ভরসা করলাম। আল্লাহ ছাড়া কোনো শক্তি ও সামর্থ্য নেই।',source:'সুনান আবু দাউদ'},
{cat:'মসজিদ',title:'মসজিদে প্রবেশের দোয়া',arabic:'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ',trans:'Allahummaftah li abwaba rahmatik.',meaning:'হে আল্লাহ! আমার জন্য আপনার রহমতের দরজাগুলো খুলে দিন।',source:'সহিহ মুসলিম ৭১৩'},
{cat:'মসজিদ',title:'মসজিদ থেকে বের হওয়ার দোয়া',arabic:'اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ',trans:'Allahumma inni as’aluka min fadlik.',meaning:'হে আল্লাহ! আমি আপনার অনুগ্রহ প্রার্থনা করছি।',source:'সহিহ মুসলিম ৭১৩'},
{cat:'সফর',title:'সফরের দোয়া',arabic:'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ',trans:'Subhanalladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila rabbina lamunqalibun.',meaning:'পবিত্র তিনি, যিনি এটিকে আমাদের অনুগত করে দিয়েছেন; আমরা নিজেরা তা করতে সক্ষম ছিলাম না। আর নিশ্চয়ই আমরা আমাদের রবের কাছেই ফিরে যাব।',source:'কুরআন ৪৩:১৩-১৪'},
{cat:'অসুস্থতা',title:'অসুস্থ ব্যক্তির জন্য দোয়া',arabic:'أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ',trans:'As’alullaha al-‘Azim, Rabbal-‘Arshil-‘Azim, an yashfiyak.',meaning:'আমি মহান আল্লাহর কাছে, মহান আরশের রবের কাছে প্রার্থনা করছি, তিনি যেন আপনাকে সুস্থ করেন।',source:'সুনান আবু দাউদ ৩১০৬; তিরমিযি ২০৮৩'},
{cat:'দুশ্চিন্তা',title:'দুশ্চিন্তা ও কষ্টের সময়ের দোয়া',arabic:'لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ',trans:'La ilaha illa anta subhanaka inni kuntu minaz-zalimin.',meaning:'আপনি ছাড়া কোনো উপাস্য নেই; আপনি পবিত্র। নিশ্চয়ই আমি জালিমদের অন্তর্ভুক্ত ছিলাম।',source:'কুরআন ২১:৮৭'},
{cat:'ক্ষমা',title:'ইস্তিগফার',arabic:'أَسْتَغْفِرُ اللَّهَ',trans:'Astaghfirullah.',meaning:'আমি আল্লাহর কাছে ক্ষমা প্রার্থনা করছি।',source:'সহিহ মুসলিমে নবী ﷺ-এর অধিক ইস্তিগফারের বর্ণনা রয়েছে'},
{cat:'বাবা-মা',title:'বাবা-মায়ের জন্য দোয়া',arabic:'رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا',trans:'Rabbir hamhuma kama rabbayani saghira.',meaning:'হে আমার রব! তাঁদের প্রতি দয়া করুন, যেমন তাঁরা শৈশবে আমাকে লালন-পালন করেছেন।',source:'কুরআন ১৭:২৪'}
];
let active='সব';const cats=['সব',...new Set(duas.map(d=>d.cat))];
const catsEl=document.getElementById('cats');catsEl.innerHTML=cats.map(c=>`<button class="cat ${c==='সব'?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const items=duas.filter(d=>(active==='সব'||d.cat===active)&&(!q||(d.title+d.cat+d.trans+d.meaning).toLowerCase().includes(q)));document.getElementById('count').textContent=`${items.length}টি দোয়া দেখানো হচ্ছে`;document.getElementById('list').innerHTML=items.length?items.map((d,i)=>`<article class="dua"><h2>${esc(d.title)}</h2><div class="arabic">${esc(d.arabic)}</div><div class="trans"><b>উচ্চারণ:</b> ${esc(d.trans)}</div><div class="meaning"><b>অর্থ:</b> ${esc(d.meaning)}</div><div class="source"><b>উৎস:</b> ${esc(d.source)}</div><button class="copy" onclick="copyDua(${duas.indexOf(d)})">📋 আরবি কপি</button></article>`).join(''):'<div class="empty">কোনো দোয়া পাওয়া যায়নি।</div>';}
function setCat(c){active=c;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.textContent===c));render()}
function copyDua(i){navigator.clipboard?.writeText(duas[i].arabic).then(()=>alert('আরবি দোয়া কপি হয়েছে।')).catch(()=>alert('কপি করা যায়নি।'));}
document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
