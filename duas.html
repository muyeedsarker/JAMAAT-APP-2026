['যানবাহন','১৮. যানবাহনে উঠার দোয়া','سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ','সুবহানাল্লাযী সাখখারা লানা হাযা, ওয়া মা কুন্না লাহু মুকরিনীন। ওয়া ইন্না ইলা রব্বিনা লামুনকালিবূন।','পবিত্র তিনি, যিনি এটিকে আমাদের অনুগত করে দিয়েছেন; আমরা নিজেরা তা করতে সক্ষম ছিলাম না। নিশ্চয়ই আমরা আমাদের রবের কাছেই ফিরে যাব।','কুরআন, সূরা আয-যুখরুফ ৪৩:১৩-১৪'],
['বিপদ','১৯. বিপদ ও মুসিবত থেকে পরিত্রাণের দোয়া','لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ','লা ইলাহা ইল্লা আনতা সুবহানাকা ইন্নী কুনতু মিনায যালিমীন।','আপনি ছাড়া কোনো উপাস্য নেই। আপনি পবিত্র। নিশ্চয়ই আমি জালিমদের অন্তর্ভুক্ত ছিলাম।','কুরআন, সূরা আল-আম্বিয়া ২১:৮৭'],
['রোজা','২০. ইফতারের সময় দোয়া','ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ','যাহাবায যামাউ, ওয়াবতাল্লাতিল ‘উরূকু, ওয়া ছাবাতাল আজরু ইনশা আল্লাহ।','পিপাসা দূর হয়েছে, শিরাগুলো সিক্ত হয়েছে এবং আল্লাহ চাইলে সওয়াব নিশ্চিত হয়েছে।','সুনান আবু দাউদ ২৩৫৭'],
['কবর','২১. কবর জিয়ারতের দোয়া','السَّلَامُ عَلَيْكُمْ دَارَ قَوْمٍ مُؤْمِنِينَ وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ، نَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ','আসসালামু ‘আলাইকুম দারা কাওমিম মুমিনীন, ওয়া ইন্না ইনশা আল্লাহু বিকুম লাহিকূন। নাসআলুল্লাহা লানা ওয়া লাকুমুল ‘আফিয়াহ।','হে মুমিনদের আবাসস্থলের অধিবাসীগণ, আপনাদের ওপর শান্তি বর্ষিত হোক। আল্লাহ চাইলে আমরাও আপনাদের সঙ্গে মিলিত হব। আমরা আল্লাহর কাছে আমাদের ও আপনাদের জন্য নিরাপত্তা ও কল্যাণ চাই।','সহিহ মুসলিম ৯৭৫'],

['সফর','২৩. সফর শেষে ফেরার সময় দোয়া','آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ','আয়িবূনা, তাইবূনা, ‘আবিদূনা, লিরব্বিনা হামিদূন।','আমরা প্রত্যাবর্তনকারী, তওবাকারী, ইবাদতকারী এবং আমাদের রবের প্রশংসাকারী।','সহিহ মুসলিম ১৩৪৫']
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const toc=document.getElementById('toc');toc.innerHTML=duas.map((d,i)=>`<a href="#d${i}">${esc(d[1])}</a>`).join('');
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const a=duas.filter(d=>!q||(d.join(' ').toLowerCase().includes(q)));document.getElementById('count').textContent=`মোট ${duas.length}টি অনন্য দোয়া • ${a.length}টি দেখানো হচ্ছে`;document.getElementById('list').innerHTML=a.length?a.map(d=>{const i=duas.indexOf(d);return `<article class="dua" id="d${i}"><h2>${esc(d[1])}</h2><div class="arabic">${esc(d[2])}</div><div class="pron"><b>বাংলা উচ্চারণ:</b> ${esc(d[3])}</div><div class="meaning"><b>অর্থ:</b> ${esc(d[4])}</div><div class="source"><b>উৎস:</b> ${esc(d[5])}</div></article>`}).join(''):'<div class="empty">কোনো দোয়া পাওয়া যায়নি।</div>';}
document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
